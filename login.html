<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design.css">
    <title>VolleyTrack</title>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div id="sign-up">Sign-up</div>
            <div class="forms">
                <p>Email</p>
                <input type="text" placeholder="Enter Email" name="email" required class="input">
                <p>Password</p>
                <input type="password" placeholder="Enter Password" name="psw" required class="input">
                <p>Repeat password</p>
                <input type="password" placeholder="Repeat Password" name="psw-repeat" required class="input">
            </div>
            <div>
                <input type="submit">
            </div>
        </div>
    </div>
</body>
</html>
