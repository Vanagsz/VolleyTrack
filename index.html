<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design.css">
    <title>VolleyTrack</title>
</head>
<body>
    <div class="container">
        <div class="logo-upper">
            <h1 class="text-logo">VolleyTrack</h1>
        </div>
        <div class="login-container">
            <div id="sign-up">Sign-up</div>
            <div class="forms">
                <label for="usr" class="label">Username</label>
                <input type="text" placeholder="Enter a unique username" name="usr" required class="input">
                <label for="email" class="label">Email</label>
                <input type="text" placeholder="ex. example@gmail.com" name="email" required class="input">
                <label for="psw" class="label">Password</label>
                <input type="password" placeholder="Enter Password" name="psw" required class="input">
                <label for="psw-repeat" class="label">Repeat password</label>
                <input type="password" placeholder="Repeat Password" name="psw-repeat" required class="input">
            </div>
            <div class="submit">
                <button type="submit" class="sign-up-btn">Sign-up</button>
                <button type="button" class="log-in-btn">Log-in</button>
            </div>
        </div>
    </div>
</body>
</html>
